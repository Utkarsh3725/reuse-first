name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command or prompt you ran, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and how you ran it (Claude Code plugin, CLI or web demo)
      placeholder: Windows 11, Python 3.12, CLI
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the error line or traceback. Remove any tokens first.
      render: text
