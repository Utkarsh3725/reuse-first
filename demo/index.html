<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reuse First</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e3de;--accent:#2f5bea;--accent-ink:#fff;
--ok:#1d7a46;--ok-bg:#e3f4ea;--bad:#a8321f;--bad-bg:#fbe7e3;--warn:#8a5a00;--warn-bg:#fdf1d8;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1e1e1c;--ink:#ecebe6;--muted:#9c9b95;
--line:#2e2e2b;--accent:#7b9bff;--accent-ink:#0d1330;--ok:#6fd39b;--ok-bg:#16301f;--bad:#ff9a85;--bad-bg:#3a1c16;
--warn:#f2c46b;--warn-bg:#352a12;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1040px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.step{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
form.search{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
background:var(--card);color:var(--ink);font:inherit}
textarea{width:100%;min-height:60px;resize:vertical}
button{padding:11px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 14px system-ui;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
label.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;width:100%}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.examples button{background:var(--chip);color:var(--ink);font-weight:500;padding:5px 10px;font-size:13px}
.grid{display:grid;gap:10px}
.repo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;
grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.repo.sel{outline:2px solid var(--accent)}
.repo.excl{opacity:.62}
.repo a{color:var(--ink);font-weight:600;text-decoration:none}
.repo a:hover{text-decoration:underline}
.desc{color:var(--muted);font-size:14px;grid-column:1/-1}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;grid-column:1/-1;align-items:center}
.badge{padding:2px 8px;border-radius:99px;background:var(--chip)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.score{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px}
.bar{width:90px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
code,.mono{font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace}
ul.plain{margin:0;padding-left:18px}
ol{margin:0;padding-left:20px}
.layer{display:flex;gap:8px;margin-bottom:4px;font-size:14px}
.layer b{min-width:72px;font-weight:600}
pre{background:var(--chip);padding:12px;border-radius:8px;overflow:auto;max-height:320px;font-size:12.5px;white-space:pre-wrap}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hidden{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:600px){.repo{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Reuse First</h1>
  <p class="sub">Describe what you want to build. Find existing GitHub projects, borrow the best architecture, and start from a scaffold instead of a blank folder.</p>

  <div class="step">1 · Describe your project</div>
  <form class="search" id="f">
    <input type="text" id="q" placeholder="e.g. extract tables from pdf files" autocomplete="off" required>
    <button id="go">Find codebases</button>
    <label class="check"><input type="checkbox" id="cl"> Allow copyleft licenses (GPL, MPL…)</label>
  </form>
  <div class="examples" id="ex"></div>

  <section id="results" class="hidden">
    <div class="step">2 · Ranked existing codebases</div>
    <div id="list" class="grid"></div>
  </section>

  <section id="bpwrap" class="hidden">
    <div class="step">3 · Architecture blueprint</div>
    <div id="bp" class="panel"></div>
  </section>

  <section id="genwrap" class="hidden">
    <div class="step">4 · Generate your starter project</div>
    <div class="panel">
      <div class="row" style="margin-top:0">
        <input type="text" id="pname" placeholder="Project name">
      </div>
      <div class="row"><textarea id="idea" placeholder="One-paragraph idea for the README"></textarea></div>
      <div class="row"><button id="gen">Generate starter</button><span id="genmsg" class="muted"></span></div>
      <div id="genout"></div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let chosen = null;

["extract tables from pdf files","self-hosted url shortener","markdown note taking app","rate limiter api gateway"]
  .forEach(t => { const b = document.createElement("button"); b.type="button"; b.textContent=t;
    b.onclick = () => { $("#q").value = t; $("#f").requestSubmit(); }; $("#ex").append(b); });

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `Request failed (${r.status})`);
  return j;
}
const ago = iso => { if (!iso) return "unknown"; const d = (Date.now() - new Date(iso)) / 864e5;
  return d < 1 ? "today" : d < 60 ? `${Math.round(d)}d ago` : d < 730 ? `${Math.round(d/30)}mo ago` : `${(d/365).toFixed(1)}y ago`; };

$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#go").disabled = true; $("#results").classList.remove("hidden");
  $("#bpwrap").classList.add("hidden"); $("#genwrap").classList.add("hidden");
  $("#list").innerHTML = `<div class="muted"><span class="spin"></span>Searching GitHub and scoring…</div>`;
  try {
    const repos = await api(`/api/find?q=${encodeURIComponent(q)}&copyleft=${$("#cl").checked}`);
    $("#idea").value = q.charAt(0).toUpperCase() + q.slice(1) + ".";
    if (!repos.length) { $("#list").innerHTML = `<div class="muted">No repositories found. Try broader words.</div>`; return; }
    $("#list").innerHTML = repos.map((r, i) => {
      const ex = r.excluded.length;
      const lic = ex && r.excluded.some(x => x.startsWith("license"))
        ? `<span class="badge bad">${esc(r.license || "no license")}</span>`
        : `<span class="badge ok">${esc(r.license)}</span>`;
      const pct = r.score == null ? 0 : Math.round(r.score * 100);
      return `<div class="repo ${ex ? "excl" : ""}" data-i="${i}">
        <div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name)}</a></div>
        <div class="score" title="confidence ${r.confidence}"><span class="bar"><i style="width:${pct}%"></i></span>${r.score ?? "?"}</div>
        <div class="desc">${esc(r.description || "No description")}</div>
        <div class="meta">${lic}<span class="badge">★ ${r.stars ?? "?"}</span><span class="badge">pushed ${ago(r.pushed_at)}</span>
          ${r.language ? `<span class="badge">${esc(r.language)}</span>` : ""}
          ${r.confidence < 0.75 ? `<span class="badge warn">low confidence</span>` : ""}
          ${r.excluded.map(x => `<span class="badge bad">excluded: ${esc(x)}</span>`).join("")}
          <span style="flex:1"></span>
          <button class="ghost use" ${ex ? "disabled title='Not safe to reuse'" : ""}>Use this architecture →</button></div>
      </div>`;
    }).join("");
    document.querySelectorAll(".use").forEach(b => b.onclick = () => pick(repos[b.closest(".repo").dataset.i], b.closest(".repo")));
  } catch (err) { $("#list").innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  finally { $("#go").disabled = false; }
};

async function pick(repo, el) {
  document.querySelectorAll(".repo").forEach(x => x.classList.remove("sel")); el.classList.add("sel");
  chosen = repo; $("#bpwrap").classList.remove("hidden"); $("#genwrap").classList.add("hidden");
  $("#bp").innerHTML = `<span class="spin"></span>Reading ${esc(repo.full_name)}: tree, README, manifests…`;
  $("#bpwrap").scrollIntoView({behavior: "smooth"});
  try {
    const b = await api(`/api/blueprint?repo=${encodeURIComponent(repo.full_name)}`);
    const s = b.stack;
    const langs = Object.entries(s.languages).map(([k, v]) => `<span class="chip">${esc(k)} ${Math.round(v*100)}%</span>`).join("");
    const layers = Object.entries(b.layers).map(([k, v]) => `<div class="layer"><b>${esc(k)}</b><span>${v.map(d => `<code>${esc(d)}/</code>`).join(", ")}</span></div>`).join("");
    $("#bp").innerHTML = `
      <div class="row" style="margin:0 0 14px"><b>${esc(b.source)}</b><span class="badge ok">${esc(b.license || "?")}</span>
        <span class="muted">${b.total_files} files${b.tree_truncated ? " (tree truncated)" : ""}</span></div>
      <div class="cols">
        <div><h3>Languages</h3><div class="chips">${langs || "<span class='muted'>unknown</span>"}</div>
          <h3 style="margin-top:14px">Frameworks</h3><div class="chips">${s.frameworks.map(f => `<span class="chip">${esc(f)}</span>`).join("") || "<span class='muted'>none detected</span>"}</div>
          <h3 style="margin-top:14px">Infra</h3><div class="chips">${s.infra.map(f => `<span class="chip">${esc(f)}</span>`).join("") || "<span class='muted'>none detected</span>"}</div></div>
        <div><h3>Layers</h3>${layers || "<span class='muted'>flat layout</span>"}
          <h3 style="margin-top:14px">Entrypoints</h3><ul class="plain mono">${b.entrypoints.map(e => `<li>${esc(e)}</li>`).join("") || "<li class='muted'>none found</li>"}</ul></div>
        <div><h3>Build plan</h3><ol>${b.build_plan.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>
      </div>
      <h3 style="margin-top:16px">Key dependencies</h3>
      <div class="chips">${b.key_dependencies.slice(0, 24).map(d => `<span class="chip mono">${esc(d)}</span>`).join("") || "<span class='muted'>none parsed</span>"}</div>`;
    $("#pname").value = $("#q").value.trim().split(/\s+/).slice(0, 3).join(" ");
    $("#genout").innerHTML = ""; $("#genmsg").textContent = "";
    $("#genwrap").classList.remove("hidden");
  } catch (err) { $("#bp").innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}

$("#gen").onclick = async () => {
  if (!chosen) return;
  $("#gen").disabled = true; $("#genmsg").innerHTML = `<span class="spin"></span>Generating…`;
  try {
    const r = await api("/api/scaffold", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({repo: chosen.full_name, name: $("#pname").value, idea: $("#idea").value})});
    $("#genmsg").textContent = `${r.files.length} files created.`;
    $("#genout").innerHTML = `<div class="row"><a href="${r.download}"><button type="button">Download .zip</button></a></div>
      <div class="cols" style="margin-top:14px">
        <div><h3>Files</h3><ul class="plain mono">${r.files.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
        <div style="grid-column:span 2"><h3>ARCHITECTURE.md</h3><pre>${esc(r.architecture_md)}</pre></div>
      </div>
      <p class="muted">Next: open this folder in Claude Code with the plugin installed and say “implement the build plan”.</p>`;
  } catch (err) { $("#genmsg").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  finally { $("#gen").disabled = false; }
};
</script>
</body>
</html>
